# /etc/nginx/sites-available/tawreed   (then: ln -s ../sites-available/tawreed /etc/nginx/sites-enabled/)
# Replace tawreed.example.com with your domain, then run: certbot --nginx -d tawreed.example.com
server {
    listen 80;
    server_name tawreed.example.com;

    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
